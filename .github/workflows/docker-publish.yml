name: Build and Push Images

# Run on pushes to main, on any git tag, or manually from the Actions tab.
on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

jobs:
  # Builds the api and frontend images and pushes them to Docker Hub.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for the SARIF uploads to code scanning

    env:
      # Docker Hub account the images are published under.
      NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}
      # Git tag push -> use the tag name; anything else -> latest.
      IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

    steps:
      # Fetch the repo so the Dockerfiles and sources are available.
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate so the push steps below are allowed.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pin the Trivy binary used by the image scans below.
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.73.0

      # ----- api -----

      # Build the api image from ./api.
      - name: Build api
        run: docker build -t "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG" ./api

      # Scan once into JSON, then convert. `trivy convert` re-renders an
      # existing report, so the table and SARIF cost no extra scan.
      # Informational only: no --exit-code, so findings never fail the build.
      - name: Scan api image
        run: |
          trivy image \
            --format json \
            --output trivy-api-image.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG"
          trivy convert --format table trivy-api-image.json
          trivy convert --format sarif --output trivy-api.sarif trivy-api-image.json

      # Separate run from the scan above: that report is severity-filtered,
      # while an SBOM needs the image's full package inventory.
      - name: Generate api image SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-api-image.json \
            "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG"

      # Publish the api image to Docker Hub.
      - name: Push api
        run: docker push "$NAMESPACE/devsecops-workshop-api:$IMAGE_TAG"

      # ----- frontend -----

      # Build the frontend image from ./frontend.
      - name: Build frontend
        run: docker build -t "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG" ./frontend

      # Same scan-then-convert flow as the api image above.
      - name: Scan frontend image
        run: |
          trivy image \
            --format json \
            --output trivy-frontend-image.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed \
            "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG"
          trivy convert --format table trivy-frontend-image.json
          trivy convert --format sarif --output trivy-frontend.sarif trivy-frontend-image.json

      # Same full-inventory SBOM as the api image above.
      - name: Generate frontend image SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-frontend-image.json \
            "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG"

      # Publish the frontend image to Docker Hub.
      - name: Push frontend
        run: docker push "$NAMESPACE/devsecops-workshop-frontend:$IMAGE_TAG"

      # ----- reporting -----

      # Each upload needs its own category. Without it, the second upload
      # replaces the first one's alerts -- including Semgrep's.
      - name: Upload api SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      # Same, under its own category for the frontend image.
      - name: Upload frontend SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # One engagement per image, matching the Dependency-Track project that
      # the native DT integration imports into. Trivy and DT then land as two
      # tests in the same engagement -- different scan_type, so they coexist
      # rather than overwrite, and dedup can merge them if both parsers share
      # the same hashcode configuration.
      - name: Publish Trivy results to DefectDojo
        env:
          DD_URL: ${{ secrets.DEFECTDOJO_URL }}
          DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DD_ENGAGEMENT: ${{ vars.DEFECTDOJO_ENGAGEMENT }}
          DD_PRODUCT: ${{ vars.DEFECTDOJO_PRODUCT }}
          DD_ENGAGEMENT_API: ${{ vars.DEFECTDOJO_ENGAGEMENT_API }}
          DD_ENGAGEMENT_FRONTEND: ${{ vars.DEFECTDOJO_ENGAGEMENT_FRONTEND }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          upload() {
            local file="$1" title="$2" engagement="$3"
            echo "Uploading ${file} as test '${title}' in engagement '${engagement}'"
            curl -sS --fail-with-body \
              -X POST "${DD_URL%/}/api/v2/reimport-scan/" \
              -H "Authorization: Token ${DD_TOKEN}" \
              -F "scan_type=Trivy Scan" \
              -F "file=@${file}" \
              -F "product_name=${DD_PRODUCT}" \
              -F "engagement_name=${engagement}" \
              -F "test_title=${title}" \
              -F "auto_create_context=true" \
              -F "close_old_findings=true" \
              -F "active=true" \
              -F "verified=false" \
              -F "branch_tag=${BRANCH}" \
              -F "commit_hash=${COMMIT}" \
              -F "build_id=${BUILD_ID}"
            echo
          }

          upload trivy-api-image.json trivy-api "$DD_ENGAGEMENT_API"
          upload trivy-frontend-image.json trivy-frontend "$DD_ENGAGEMENT_FRONTEND"

      # Keep the image SBOMs downloadable from the run summary.
      - name: Upload image SBOMs as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-sbom
          path: trivy-*-image.json

      # Separate projects from the cdxgen source SBOMs in sbom.yml. A BOM
      # upload replaces a project's component list, so image and source SBOMs
      # must not share a project or they overwrite each other.
      - name: Publish image SBOMs to Dependency-Track
        env:
          DT_URL: ${{ secrets.DEPENDENCYTRACK_URL }}
          DT_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          DT_PROJECT_API_IMAGE: ${{ vars.DT_PROJECT_API_IMAGE }}
          DT_PROJECT_FRONTEND_IMAGE: ${{ vars.DT_PROJECT_FRONTEND_IMAGE }}
        run: |
          upload() {
            local file="$1" project="$2"
            echo "Uploading ${file} -> project ${project}"
            curl -sS --fail-with-body \
              -X POST "${DT_URL%/}/api/v1/bom" \
              -H "X-Api-Key: ${DT_KEY}" \
              -F "project=${project}" \
              -F "bom=@${file}"
            echo
          }

          upload sbom-api-image.json "$DT_PROJECT_API_IMAGE"
          upload sbom-frontend-image.json "$DT_PROJECT_FRONTEND_IMAGE"
